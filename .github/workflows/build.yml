name: OPlus Payload Mods Builder

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: Direct URL to payload.bin or a full OTA ZIP
        required: true
        type: string
      enable_debloat:
        description: Apply debloat
        required: true
        type: boolean
        default: true
      enable_youtube_morphe:
        description: Integrate YouTube Morphe without microG
        required: true
        type: boolean
        default: true
      youtube_morphe_url:
        description: Optional YouTube Morphe module URL (blank = latest)
        required: false
        type: string
        default: ""
      enable_ggphotos_unlimited:
        description: Apply GGPhotosUnlimited
        required: true
        type: boolean
        default: true
      enable_disable_flag_secure:
        description: Apply DisableFlagSecure
        required: true
        type: boolean
        default: true
      enable_lock_assistant_bypass:
        description: Apply LockAssistantBypass
        required: true
        type: boolean
        default: true
permissions:
  contents: read

jobs:
  build:
    name: Build and upload ROM
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 1024
          root-reserve-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            aapt aria2 git-lfs openjdk-21-jre-headless p7zip-full \
            python3 rclone unzip zip zipalign

      - name: Check required secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          GDRIVE_DESTINATION: ${{ secrets.GDRIVE_DESTINATION }}
        run: |
          test -n "$PRIVATE_REPO_TOKEN" || { echo "Missing PRIVATE_REPO_TOKEN"; exit 1; }
          test -n "$RCLONE_CONFIG_BASE64" || { echo "Missing RCLONE_CONFIG_BASE64"; exit 1; }
          test -n "$GDRIVE_DESTINATION" || { echo "Missing GDRIVE_DESTINATION"; exit 1; }

      - name: Clone private builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vn-ncvinh/OPlus_Payload_Mods
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: builder
          lfs: true
          persist-credentials: false

      - name: Download ROM
        shell: bash
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          case "$ROM_URL" in
            https://*|http://*) ;;
            *) echo "rom_url must use HTTP or HTTPS"; exit 1 ;;
          esac
          aria2c --continue=true --max-connection-per-server=16 \
            --split=16 --min-split-size=10M \
            --dir="$GITHUB_WORKSPACE" --out=rom-input "$ROM_URL"
          test -s "$GITHUB_WORKSPACE/rom-input"

      - name: Build recovery ZIP
        shell: bash
        working-directory: builder
        env:
          ENABLE_DEBLOAT: ${{ inputs.enable_debloat }}
          ENABLE_YOUTUBE: ${{ inputs.enable_youtube_morphe }}
          YOUTUBE_URL: ${{ inputs.youtube_morphe_url }}
          ENABLE_PHOTOS: ${{ inputs.enable_ggphotos_unlimited }}
          ENABLE_SECURE: ${{ inputs.enable_disable_flag_secure }}
          ENABLE_LOCK_BYPASS: ${{ inputs.enable_lock_assistant_bypass }}
        run: |
          args=("$GITHUB_WORKSPACE/rom-input" --output "$GITHUB_WORKSPACE/build-output")
          [[ "$ENABLE_DEBLOAT" == true ]] || args+=(--skip-debloat)
          [[ "$ENABLE_YOUTUBE" == true ]] || args+=(--skip-youtube-morphe)
          [[ "$ENABLE_PHOTOS" == true ]] || args+=(--skip-photos-spoof)
          [[ "$ENABLE_SECURE" == true ]] || args+=(--skip-secure-flag)
          [[ "$ENABLE_LOCK_BYPASS" == true ]] || args+=(--skip-lock-assistant-bypass)
          [[ -z "$YOUTUBE_URL" ]] || args+=(--youtube-morphe-url "$YOUTUBE_URL")
          set +e
          ./start-oplus.sh "${args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          exit "$build_status"

      - name: Upload output to Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          GDRIVE_DESTINATION: ${{ secrets.GDRIVE_DESTINATION }}
          ENABLE_DEBLOAT: ${{ inputs.enable_debloat }}
          ENABLE_YOUTUBE: ${{ inputs.enable_youtube_morphe }}
          ENABLE_PHOTOS: ${{ inputs.enable_ggphotos_unlimited }}
          ENABLE_SECURE: ${{ inputs.enable_disable_flag_secure }}
          ENABLE_LOCK_BYPASS: ${{ inputs.enable_lock_assistant_bypass }}
        run: |
          config="$RUNNER_TEMP/rclone.conf"
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$config"
          chmod 600 "$config"

          mapfile -t outputs < <(find "$GITHUB_WORKSPACE/build-output" \
            -maxdepth 1 -type f -name '*_Recovery.zip' -print)
          [[ ${#outputs[@]} -eq 1 ]] || {
            echo "Expected exactly one recovery ZIP, found ${#outputs[@]}"
            exit 1
          }

          output="${outputs[0]}"
          filename="$(basename "$output")"
          case "$filename" in
            X9U_Mods_*)
              device=Oppo_Find_X9_Ultra
              model="OPPO Find X9 Ultra"
              abl_version=16.0.6
              ;;
            OP15R_Mods_*)
              device=OnePlus_15R
              model="OnePlus 15R"
              abl_version=16.0.1
              ;;
            *) echo "Cannot detect device from output filename: $filename"; exit 1 ;;
          esac

          destination="${GDRIVE_DESTINATION%/}/$device"
          output_sha256="$(sha256sum "$output" | awk '{print $1}')"
          rclone --config "$config" copyto --progress \
            "$output" "$destination/$filename"

          file_id="$(rclone --config "$config" lsjson \
            "$destination/$filename" --stat | \
            python3 -c 'import json, sys; print(json.load(sys.stdin).get("ID", ""))')"
          [[ -n "$file_id" ]] || {
            echo "Unable to read the uploaded Google Drive file ID"
            exit 1
          }
          drive_url="https://drive.google.com/file/d/$file_id"

          {
            echo "## Build complete"
            echo
            echo "- Model: **$model**"
            echo "- Mods enabled:"
            [[ "$ENABLE_DEBLOAT" == true ]] && echo "  - Debloat"
            [[ "$ENABLE_YOUTUBE" == true ]] && echo "  - YouTube Morphe"
            [[ "$ENABLE_PHOTOS" == true ]] && echo "  - GGPhotosUnlimited"
            [[ "$ENABLE_SECURE" == true ]] && echo "  - DisableFlagSecure"
            [[ "$ENABLE_LOCK_BYPASS" == true ]] && echo "  - LockAssistantBypass"
            echo "  - DisableSafeMediaVolume"
            echo "  - AVB fstab patch"
            echo "  - abl $abl_version (still GBL vulnerability)"
            echo "  - GBL Chainload mode 1"
            echo "- Download URL: [$filename]($drive_url)"
            echo "- SHA-256: \`$output_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failure
        if: ${{ failure() }}
        shell: bash
        env:
          ENABLE_DEBLOAT: ${{ inputs.enable_debloat }}
          ENABLE_YOUTUBE: ${{ inputs.enable_youtube_morphe }}
          ENABLE_PHOTOS: ${{ inputs.enable_ggphotos_unlimited }}
          ENABLE_SECURE: ${{ inputs.enable_disable_flag_secure }}
          ENABLE_LOCK_BYPASS: ${{ inputs.enable_lock_assistant_bypass }}
        run: |
          log="$GITHUB_WORKSPACE/build.log"
          model="Unknown"
          abl_version=""
          reason="Workflow stopped before the builder reported an error"

          if [[ -s "$log" ]]; then
            detected="$(sed -n 's/^\[INFO\] Detected \(.*\) (project ID: .*/\1/p' "$log" | tail -n 1)"
            project_id="$(sed -n 's/^\[ERROR\] Unsupported project ID from payload: //p' "$log" | tail -n 1)"
            arb_warning="$(sed -n 's/^\[WARN\] \(Anti-rollback is enabled.*\)/\1/p' "$log" | tail -n 1)"
            last_error="$(sed -n 's/^\[ERROR\] //p' "$log" | tail -n 1)"

            if [[ -n "$detected" ]]; then
              model="$detected"
            elif [[ -n "$project_id" ]]; then
              model="Unknown (project ID: $project_id)"
            fi
            case "$model" in
              "OPPO Find X9 Ultra") abl_version=16.0.6 ;;
              "OnePlus 15R") abl_version=16.0.1 ;;
            esac
            [[ -z "$last_error" ]] || reason="$last_error"
            [[ -z "$arb_warning" ]] || reason="$arb_warning; $reason"
          fi

          {
            echo "## Build failed"
            echo
            echo "- Model: **$model**"
            echo "- Mods requested:"
            [[ "$ENABLE_DEBLOAT" == true ]] && echo "  - Debloat"
            [[ "$ENABLE_YOUTUBE" == true ]] && echo "  - YouTube Morphe"
            [[ "$ENABLE_PHOTOS" == true ]] && echo "  - GGPhotosUnlimited"
            [[ "$ENABLE_SECURE" == true ]] && echo "  - DisableFlagSecure"
            [[ "$ENABLE_LOCK_BYPASS" == true ]] && echo "  - LockAssistantBypass"
            echo "  - DisableSafeMediaVolume"
            echo "  - AVB fstab patch"
            [[ -z "$abl_version" ]] || echo "  - abl $abl_version (still GBL vulnerability)"
            echo "  - GBL Chainload mode 1"
            echo "- Reason: \`$reason\`"
          } >> "$GITHUB_STEP_SUMMARY"
