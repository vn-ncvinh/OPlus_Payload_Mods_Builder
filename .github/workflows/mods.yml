name: OPlus Payload Mods Builder

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: Direct link to payload.bin or a full OTA ZIP
        required: true
        type: string
      ace6t_ota_url:
        description: OnePlus Ace 6T OTA URL - OnePlus 15R only, and always required there
        required: false
        type: string
        default: ""
      youtube_morphe_url:
        description: YouTube Morphe module URL - blank picks the latest
        required: false
        type: string
        default: ""
      my_preload_url:
        description: my_preload.img URL - blank uses the donor the profile ships
        required: false
        type: string
        default: ""
      enable_lock_assistant_bypass:
        description: Carrier-lock bypass
        required: true
        type: boolean
        default: true
      enable_ota_card_brand:
        description: Put a name in front of the version on the OTA card
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      build_mode: mods
      rom_url: ${{ inputs.rom_url }}
      ace6t_ota_url: ${{ inputs.ace6t_ota_url }}
      my_preload_url: ${{ inputs.my_preload_url }}
      youtube_morphe_url: ${{ inputs.youtube_morphe_url }}
      enable_lock_assistant_bypass: ${{ inputs.enable_lock_assistant_bypass }}
      enable_ota_card_brand: ${{ inputs.enable_ota_card_brand }}
